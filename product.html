<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | Dave Tech Services</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<script src="nav.js"></script>

<section class="detail-section">
  <a href="store.html" class="detail-back">← Back to Store</a>

  <div class="detail-container">

    <div class="detail-gallery reveal">
      <img id="pImg" src="" alt="Product">
    </div>

    <div class="detail-info reveal reveal-d2">
      <div class="section-label" id="pLabel">DTS Store</div>
      <h1 id="pName">Loading…</h1>
      <div class="detail-price" id="pPrice">$0</div>
      <p class="detail-desc" id="pDesc">Loading product details…</p>

      <div class="detail-actions">
        <button class="btn btn-primary" id="addCartBtn">🛒 Add to Cart</button>
        <a href="checkout.html" class="btn btn-outline" id="buyNowBtn">Buy Now →</a>
        <a href="#" class="btn btn-dark" id="waBtn" target="_blank">💬 WhatsApp</a>
      </div>

      <div style="margin-top:32px;padding:20px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;">
        <p style="font-size:13px;color:var(--muted);margin-bottom:8px;">🚚 Fast delivery across Haiti</p>
        <p style="font-size:13px;color:var(--muted);margin-bottom:8px;">✅ Quality guaranteed</p>
        <p style="font-size:13px;color:var(--muted);">📞 Support: <a href="https://wa.me/50946126417" style="color:var(--blue);">+509 46 12 64 17</a></p>
      </div>
    </div>

  </div>
</section>

<script src="footer.js"></script>
<script src="cart.js"></script>
<script>
  const p = new URLSearchParams(window.location.search);
  const name  = p.get('name')  || 'Product';
  const price = parseFloat(p.get('price') || 0);
  const img   = p.get('img')   || '';
  const desc  = p.get('desc')  || 'Quality product from DTS Store. Contact us on WhatsApp for more details.';

  document.title = name + ' | Dave Tech Services';
  document.getElementById('pName').textContent  = name;
  document.getElementById('pPrice').textContent = '$' + price.toFixed(2);
  document.getElementById('pDesc').textContent  = desc;

  const imgEl = document.getElementById('pImg');
  imgEl.src = img;
  imgEl.alt = name;
  imgEl.onerror = () => {
    imgEl.parentElement.innerHTML = '<div style="font-size:100px;opacity:0.3;text-align:center;">📦</div>';
  };

  document.getElementById('addCartBtn').addEventListener('click', () => {
    Cart.add(name, price, img, desc);
  });

  document.getElementById('buyNowBtn').href = 'checkout.html';

  document.getElementById('waBtn').href =
    `https://wa.me/50946126417?text=Bonjour%20DTS!%20Je%20veux%20commander%20${encodeURIComponent(name)}%20-%20$${price}`;
</script>
</body>
</html>
